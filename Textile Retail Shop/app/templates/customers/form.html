{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h4><i class="bi bi-person"></i> {{ 'Edit' if customer else 'New' }} Customer</h4>
</div>
<form method="post" class="card p-3">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Name *</label><input class="form-control" name="name" required value="{{ customer.name if customer else '' }}"></div>
    <div class="col-md-3"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ customer.phone if customer else '' }}"></div>
    <div class="col-md-3"><label class="form-label">Email</label><input class="form-control" name="email" value="{{ customer.email if customer else '' }}"></div>
    <div class="col-md-9"><label class="form-label">Address</label><input class="form-control" name="address" value="{{ customer.address if customer else '' }}"></div>
    <div class="col-md-3"><label class="form-label">State code</label><input class="form-control" name="state_code" value="{{ customer.state_code if customer else '33' }}"></div>
    <div class="col-md-6"><label class="form-label">GSTIN (for B2B)</label><input class="form-control" name="gstin" value="{{ customer.gstin if customer else '' }}"></div>
  </div>
  <div class="mt-3"><button class="btn btn-brand">Save</button> <a href="{{ url_for('customers.list_customers') }}" class="btn btn-outline-secondary">Cancel</a></div>
</form>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h4><i class="bi bi-person-badge"></i> {{ 'Edit' if staff else 'New' }} Staff</h4>
</div>
<form method="post" class="card p-3">
  <div class="row g-3">
    {% if not staff %}<div class="col-md-4"><label class="form-label">Username *</label><input class="form-control" name="username" required></div>{% endif %}
    <div class="col-md-4"><label class="form-label">Full name *</label><input class="form-control" name="full_name" required value="{{ staff.full_name if staff else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ staff.phone if staff else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Email</label><input class="form-control" name="email" value="{{ staff.email if staff else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Role</label>
      <select class="form-select" name="role">
        {% for r in ['cashier','manager','admin'] %}<option value="{{ r }}" {% if staff and staff.role==r %}selected{% endif %}>{{ r }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4"><label class="form-label">Password {% if staff %}(leave blank to keep){% endif %}</label><input class="form-control" name="password" type="password"></div>
    <div class="col-md-4"><label class="form-label">Salary (₹/month)</label><input class="form-control" name="salary" type="number" step="0.01" value="{{ staff.salary if staff else 0 }}"></div>
    <div class="col-md-4"><label class="form-label">Commission %</label><input class="form-control" name="commission_pct" type="number" step="0.01" value="{{ staff.commission_pct if staff else 0 }}"></div>
    {% if staff %}<div class="col-md-4 mt-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="active" id="active" {% if staff.active %}checked{% endif %}><label class="form-check-label" for="active">Active</label></div></div>{% endif %}
  </div>
  <div class="mt-3"><button class="btn btn-brand">Save</button> <a href="{{ url_for('staff.list_staff') }}" class="btn btn-outline-secondary">Cancel</a></div>
</form>
{% endblock %}

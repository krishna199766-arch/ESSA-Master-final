// ---------- one receipt: every billed line, and what it really was ----------
function renderGrn(){
  const g=S.grn; if(!g){ S.screen='grn'; return render(); }
  const editable=g.status!=='posted';
  const unbal=(g.unbalanced_splits||[]).length;
  const short=g.shortages||{claimable_qty:0,claimable_value:0};
  // the server says outright whether the bundle is split; falling back to the rows
  // keeps an older server from making a broken-down bundle read as a plain product
  const split=(l)=>l.is_split!=null?l.is_split:l.splits.length>0;
  // the balance the breakdown hasn't accounted for — the number that is either a
  // shortage or still to be typed, and the whole reason this screen used to dead-end
  const gap=(l)=>qtyOf((l.received_qty!=null?l.received_qty:l.qty)-(l.split_qty||0));
  const lineHtml=(l,i)=>`<div class="prow" style="display:block">
      <div class="row" style="align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div class="t">${esc(l.description||'(unnamed)')}</div>
          <div class="m">HSN ${esc(l.hsn||'—')} · ${qtyOf(l.qty)} ${esc(l.uom||'')} × ₹${money(l.rate)} = ₹${money(l.amount)}</div>
          ${l.has_shortage?`<div class="m" style="color:var(--warn)">Billed ${qtyOf(l.qty)}, received <b>${qtyOf(l.received_qty)}</b>${
              l.missing_qty?` — ${qtyOf(l.missing_qty)} ${l.damaged_qty&&!l.short_qty?'damaged':'short'}, ₹${money(l.shortage_value)} to claim`:''}${
              l.excess_qty?` — ${qtyOf(l.excess_qty)} extra`:''}</div>`:''}
          ${split(l)?`<div class="m">Bundle split into ${l.splits.length} item${l.splits.length===1?'':'s'} — the rows below carry the stock, not this line.</div>`:''}
          ${l.splits.length&&!l.split_balanced?`<div class="m" style="color:var(--warn)">${qtyOf(l.split_remainder)} of ${qtyOf(l.received_qty!=null?l.received_qty:l.qty)} still to break down</div>`:''}
        </div>
        ${split(l)
          ? `<div class="badge ${l.split_balanced?'bdone':'bpend'}">split · ${l.splits.length}${l.split_balanced?'':' ⚠'}</div>`
          : `<div class="badge ${l.is_new_product?'bpend':'bdone'}">${l.is_new_product?'new':'matched'}</div>`}
      </div>
      ${/* The moment the receiver is stuck: the rows don't reach the billed
            quantity because the pieces aren't there. One tap says so, with the
            number already filled in, instead of leaving invent-or-abandon as the
            only two options. */''}
      ${editable&&!l.has_shortage&&l.splits.length&&!l.split_balanced&&gap(l)>0
        ? `<button class="link" style="padding:8px 0;display:block;text-align:left;color:var(--warn)" data-shortgap="${i}">
             ${gap(l)} not in the box? record as shortage →</button>`
        : ''}
      <div class="row" style="align-items:center;gap:8px;margin-top:10px">
        <span style="color:var(--muted);font-size:12px;flex:0 0 62px">Category</span>
        ${editable
          ? `<button class="selbtn ${l.category?'':'empty'}" data-cat="${i}" style="flex:1;padding:9px 12px;font-size:14px">${esc(l.category||(l.category_suggestion&&l.category_suggestion.best)||'auto')}</button>`
          : `<span style="font-size:13px">${esc(l.category||l.product_category||'auto')}</span>`}
      </div>
      ${editable&&!l.category&&l.category_suggestion&&l.category_suggestion.best
        /* one tap to accept what the classifier read from the description — and
           whichever category ends up here is remembered for this wording, so the
           next invoice that says it this way arrives already mapped */
        ? `<button class="link" style="padding:6px 0;display:block;text-align:left" data-usecat="${i}">use ${esc(l.category_suggestion.best)}${
            l.category_suggestion.via==='alias' ? ' · learned' : (l.category_suggestion.confident?'':' ?')}</button>`
        : ''}
      ${l.splits.map(sp=>`<div class="row" style="align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:9px;padding-top:9px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">↳ ${esc(sp.label)}</div>
            <div class="m">${qtyOf(sp.qty)} × ₹${money(sp.rate)} = ₹${money(sp.amount)}${sp.mrp?' · MRP '+money(sp.mrp):''}</div>
            <div class="m">${esc(sp.product_sku||(g.status==='posted'?'—':'SKU + QR on post'))}</div>
          </div>
          ${sp.product_id&&g.status==='posted'
            ? `<img src="/api/inventory/products/${sp.product_id}/qr.svg?scale=2" alt="QR" style="width:46px;height:46px;background:#fff;border-radius:6px;padding:2px">` : ''}
          ${editable&&!sp.product_id
            ? `<button class="btn sec" style="width:auto;padding:9px 12px" data-scan="${i}" data-split="${sp.id}">⌗ QR</button>` : ''}
        </div>`).join('')}
      ${(l.shortages||[]).map(sh=>`<div class="row" style="align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:9px;padding-top:9px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:${sh.kind==='excess'?'var(--ok)':'var(--warn)'}">
              ⚠ ${qtyOf(sh.qty)} ${esc(sh.kind)}${sh.variant?' · '+esc(sh.variant):''}</div>
            <div class="m">${esc(sh.reason||'no reason given')}${sh.claimable?` · ₹${money(sh.amount)} to claim`:''}</div>
            <div class="m">${esc(sh.recorded_by?('by '+sh.recorded_by):'')}${sh.status!=='open'?' · '+esc(sh.status):''}</div>
          </div>
        </div>`).join('')}
      ${editable?`<div class="row" style="margin-top:11px;gap:8px">
          <button class="btn sec" data-break="${i}">${l.splits.length?'Edit breakdown':'Break down into sizes'}</button>
          ${!l.splits.length?`<button class="btn sec" style="width:auto;padding:12px 14px" data-scan="${i}">⌗ QR</button>`:''}
        </div>
        <button class="btn sec" style="margin-top:8px${l.has_shortage?'':';color:var(--muted)'}" data-short="${i}">
          ${l.has_shortage?'Edit shortage':'⚠ Something missing or damaged?'}</button>`:''}
    </div>`;

  app.innerHTML=`<div class="topbar"><button class="link" id="back">‹ GRNs</button>
      <h1>${esc(g.supplier_name||('GRN #'+g.id))}</h1>
      <div class="badge ${g.status==='posted'?'bdone':'bpend'}">${esc(g.status)}</div></div>
    <div class="list" style="padding-top:12px">
      <div class="prow" style="display:block">
        <div class="m">Invoice ${esc(g.invoice_number||'—')}${g.invoice_date?' · '+esc(g.invoice_date):''}</div>
        <div class="m">GRN No ${esc(g.grn_no||'—')} · ${g.line_count} line${g.line_count===1?'':'s'}</div>
        <div class="t" style="margin-top:6px">Grand total ₹ ${money(g.grand_total)}</div>
      </div>
      ${g.lines.map(lineHtml).join('')}
    </div>
    <div class="actionbar">
      ${short.claimable_qty?`<div class="hint" style="margin-bottom:7px;color:var(--warn)">
        ⚠ ${qtyOf(short.claimable_qty)} short or damaged — ₹${money(short.claimable_value)} to claim back.</div>`:''}
      <div class="hint" style="margin-bottom:9px">${g.status==='posted'
        ? 'Posted'
        : unbal ? `⚠ ${unbal} line${unbal===1?'':'s'} broken down to the wrong total`
        : ''}</div>
      ${g.status==='posted'
        ? `<button class="btn" id="showqr">Show QR codes</button>`
        : `<button class="btn" id="post"${unbal?' disabled':''}>Post to inventory</button>`}
    </div>`;

  document.getElementById('back').onclick=()=>{ S.screen='grn'; render(); };
  app.querySelectorAll('[data-break]').forEach(b=>b.onclick=()=>openBreak(g.lines[+b.dataset.break]));
  app.querySelectorAll('[data-short]').forEach(b=>b.onclick=()=>openShort(g.lines[+b.dataset.short]));
  // arrives with the unaccounted quantity already filled in — it is the number
  // the receiver has just been told about, so retyping it is only a chance to err
  app.querySelectorAll('[data-shortgap]').forEach(b=>b.onclick=()=>{
    const l=g.lines[+b.dataset.shortgap]; openShort(l, gap(l)); });
  // a category chosen here means the products are born mapped, instead of landing
  // "unmapped" in Inventory for someone to fix one by one — and the server learns
  // the wording, so the next invoice phrased that way maps itself
  const setCat=async (line,v)=>{
    try{ await api('/api/purchases/lines/'+line.id,{method:'PATCH',body:JSON.stringify({category:v})});
      await reloadGrn(); render();
    }catch(e){ toast(e.message); }
  };
  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{
    const l=g.lines[+b.dataset.cat];
    pickSheet('Category', S.cats, l.category||'', (v)=>setCat(l,v), true);
  });
  app.querySelectorAll('[data-usecat]').forEach(b=>b.onclick=()=>{
    const l=g.lines[+b.dataset.usecat];
    setCat(l, l.category_suggestion.best);
  });
  app.querySelectorAll('[data-scan]').forEach(b=>b.onclick=()=>
    scanInto(g.lines[+b.dataset.scan], b.dataset.split?+b.dataset.split:null));
  const pb=document.getElementById('post'); if(pb) pb.onclick=postGrn;
  const sq=document.getElementById('showqr'); if(sq) sq.onclick=()=>{ S.postResult=null; S.screen='grnposted'; render(); };
}

// Pin a line (or one variant of it) to a product that already exists — for goods
// we already carry, where the supplier's wording drifts between invoices.
function scanInto(line, splitId){
  const send=async (code)=>{
    try{
      await api(`/api/purchases/lines/${line.id}/scan`,{method:'POST',body:JSON.stringify({code:code,split_id:splitId})});
      await reloadGrn(); render(); toast('✓ Linked to that product');
    }catch(e){ toast(e.message); }
  };
  if('BarcodeDetector' in window) return openScanner(send);
  const code=prompt('Scan or type the QR code / SKU for this row:');
  if(code&&code.trim()) send(code.trim());
}

async function postGrn(){
  const rows=S.grn.lines.reduce((n,l)=>n+(l.splits.length||1),0);
  const sh=S.grn.shortages||{};
  // A shortage is stated at the moment it stops being editable, because posting
  // is what turns "40 arrived" into the stock figure and "10 short" into a claim.
  if(!confirm(`Post this GRN?\n\n${rows} item${rows===1?'':'s'} go into stock. Each new one gets its own SKU and QR code, and its cost is averaged into inventory.`
      +(sh.claimable_qty?`\n\n⚠ ${qtyOf(sh.claimable_qty)} short or damaged (₹${money(sh.claimable_value)}) stays OUT of stock and becomes a claim against the supplier. The invoice keeps its own quantity.`:'')
      +`\n\nCorrecting a posted GRN means unposting it on the desktop app.`)) return;
  const btn=document.getElementById('post'); if(btn) btn.disabled=true;
  try{
    S.postResult=await api(`/api/purchases/${S.grn.id}/post`,{method:'POST'});
    await reloadGrn();                       // now carries each variant's product
    S.screen='grnposted'; render();
    if(S.postResult.short_qty) toast(`Posted · ${qtyOf(S.postResult.short_qty)} short, ₹${money(S.postResult.short_value)} to claim`);
  }catch(e){ toast('Post failed: '+e.message); if(btn) btn.disabled=false; }
}

// ---------- shortage entry: what was billed and wasn't in the box ----------
// The step that has to happen before Post to inventory, and the only person who
// can do it is the one opening the cartons. Without it the receiver's choices are
// both lies — type in ten pieces that don't exist so the breakdown balances, or
// leave the receipt unpostable — and after posting the gap is invisible: stock
// says 40, the invoice says 50, and nothing remembers why. Recorded here it is a
// document the debit note is later built from without anyone counting again.
const SHORT_KINDS=[['short','Short','not in the box'],
                   ['damaged','Damaged','arrived unusable, rejected'],
                   ['excess','Excess','more arrived than billed']];
const shortTotals=(rows)=>{
  let missing=0, excess=0;
  (rows||[]).forEach(r=>{ const q=+r.qty||0; if(r.kind==='excess') excess+=q; else missing+=q; });
  return {missing:qtyOf(missing), excess:qtyOf(excess)};
};
const blankShort=(kind,qty)=>({kind:kind||'short', qty:qty!=null?String(qty):'',
                               variant:'', reason:'', note:''});

async function loadShortOpts(){
  if(S.shortOpts) return S.shortOpts;
  try{ S.shortOpts=await api('/api/purchases/shortage-options'); }
  catch(e){ S.shortOpts={reasons:[]}; }
  return S.shortOpts;
}

// `preset` is the quantity the breakdown couldn't account for — arriving here
// from "not received?" means the number is already known and shouldn't be retyped
async function openShort(line, preset){
  S.shortLine=line;
  await loadShortOpts();
  S.shrows=(line.shortages&&line.shortages.length)
    ? line.shortages.map(sh=>({kind:sh.kind, qty:String(sh.qty), variant:sh.variant||'',
                               reason:sh.reason||'', note:sh.note||''}))
    : [blankShort('short', preset)];
  S.screen='grnshort'; render();
}

function renderShort(){
  const l=S.shortLine; if(!l){ S.screen='grndetail'; return render(); }
  const billed=+l.qty||0;
  const t=shortTotals(S.shrows);
  const received=qtyOf(billed-t.missing+t.excess);
  const reasons=(S.shortOpts&&S.shortOpts.reasons)||[];

  const rowHtml=(r,i)=>`<div class="prow" style="display:block">
      <div class="row" style="align-items:center;gap:8px">
        <span style="color:var(--muted);font-size:12px;font-weight:700">${i+1}</span>
        <div class="t" style="flex:1;min-width:0">${esc((SHORT_KINDS.find(k=>k[0]===r.kind)||[])[1]||r.kind)}${r.qty?' · '+qtyOf(r.qty)+' '+esc(l.uom||''):''}</div>
        <button class="link" style="font-size:20px;color:var(--muted)" data-shdel="${i}">×</button>
      </div>
      <div class="row" style="overflow:auto;gap:8px;margin-top:9px">
        ${SHORT_KINDS.map(([k,lab])=>`<div class="chip ${r.kind===k?'on':''}" data-shkind="${i}:${k}">${lab}</div>`).join('')}
      </div>
      <div class="row" style="gap:8px;align-items:flex-end;margin-top:9px">
        <div style="flex:1"><label>How many</label>
          <input inputmode="decimal" data-shqty="${i}" value="${esc(r.qty)}" placeholder="0" style="padding:10px 12px"></div>
        <button class="btn sec" style="width:auto;padding:11px 13px" data-shrest="${i}">rest</button>
      </div>
      <div class="field" style="margin-top:11px"><label>Reason</label>
        <button class="selbtn ${r.reason?'':'empty'}" data-shreason="${i}">${esc(r.reason||'Why?')}</button></div>
      <div class="field"><label>Which ones (if you can tell)</label>
        <input data-shtxt="${i}:variant" value="${esc(r.variant)}" placeholder="e.g. S / White — leave blank if unknown"></div>
      <div class="field" style="margin-bottom:0"><label>Note</label>
        <input data-shtxt="${i}:note" value="${esc(r.note)}" placeholder="anything the office should see"></div>
    </div>`;

  app.innerHTML=`<div class="topbar"><button class="link" id="shcancel">‹ Cancel</button><h1>Shortage</h1></div>
    <div class="controls">
      <div class="detname" style="font-size:18px">${esc(l.description||'(unnamed)')}</div>
      <div class="detmeta">Billed ${qtyOf(billed)} ${esc(l.uom||'')} × ₹${money(l.rate)}</div>
      <div class="detmeta" id="shprog"></div>
    </div>
    <div class="list">
      ${S.shrows.map(rowHtml).join('')}
      <button class="btn sec" id="shadd" style="margin-bottom:10px">+ add another</button>
      ${(l.shortages&&l.shortages.length)?`<button class="btn sec" id="shclear" style="color:var(--danger)">No shortage after all</button>`:''}
    </div>
    <div class="actionbar"><button class="btn" id="shsave">Save shortage</button></div>`;
  updShortProg();

  document.getElementById('shcancel').onclick=()=>{ S.screen='grndetail'; render(); };
  document.getElementById('shadd').onclick=()=>{ S.shrows.push(blankShort('short')); render(); };
  app.querySelectorAll('[data-shdel]').forEach(b=>b.onclick=()=>{
    S.shrows.splice(+b.dataset.shdel,1); if(!S.shrows.length) S.shrows.push(blankShort('short')); render(); });
  app.querySelectorAll('[data-shkind]').forEach(c=>c.onclick=()=>{
    const p=c.dataset.shkind.split(':'); S.shrows[+p[0]].kind=p[1]; render(); });
  // typing updates state and the running total only — re-rendering on every
  // keystroke would take the keyboard's focus with it
  app.querySelectorAll('[data-shqty]').forEach(inp=>inp.addEventListener('input',e=>{
    S.shrows[+inp.dataset.shqty].qty=e.target.value; updShortProg(); }));
  app.querySelectorAll('[data-shtxt]').forEach(inp=>inp.addEventListener('input',e=>{
    const p=inp.dataset.shtxt.split(':'); S.shrows[+p[0]][p[1]]=e.target.value; }));
  app.querySelectorAll('[data-shrest]').forEach(b=>b.onclick=()=>{
    // "rest" here means the balance the breakdown could not account for — the
    // number the receiver is staring at on the previous screen
    const i=+b.dataset.shrest;
    const others=S.shrows.reduce((n,r,j)=>n+(j===i||r.kind==='excess'?0:(+r.qty||0)),0);
    const assigned=(l.splits||[]).reduce((n,s)=>n+(+s.qty||0),0);
    const gap=assigned>0 ? billed-assigned-others : billed-others;
    S.shrows[i].qty=String(qtyOf(Math.max(0,gap)));
    const inp=app.querySelector(`[data-shqty="${i}"]`); if(inp) inp.value=S.shrows[i].qty;
    updShortProg();
  });
  app.querySelectorAll('[data-shreason]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.shreason;
    pickSheet('Reason', reasons, S.shrows[i].reason, (v)=>{ S.shrows[i].reason=v; render(); }, true);
  });
  const sc=document.getElementById('shclear');
  if(sc) sc.onclick=()=>{ if(confirm('Clear the shortage?\n\nThe whole billed quantity goes back to being expected in stock.')) saveShort([]); };
  document.getElementById('shsave').onclick=submitShort;
}

function updShortProg(){
  const l=S.shortLine, billed=+l.qty||0;
  const t=shortTotals(S.shrows);
  const received=qtyOf(billed-t.missing+t.excess);
  const el=document.getElementById('shprog');
  if(!el) return;
  const rate=+l.rate||0;
  el.innerHTML=`Into stock <b>${received}</b> of ${qtyOf(billed)} billed`
    +(t.missing?` · <span style="color:var(--warn)">${t.missing} short — ₹${money(t.missing*rate)} to claim</span>`:'')
    +(t.excess?` · <span style="color:var(--ok)">${t.excess} extra</span>`:'');
}

function submitShort(){
  const l=S.shortLine, billed=+l.qty||0;
  const kept=S.shrows.filter(r=>+r.qty>0);
  if(!kept.length){ toast('Enter how many were missing, damaged or extra'); return; }
  const t=shortTotals(kept);
  if(t.missing>billed+0.001){
    toast(`${t.missing} short of ${qtyOf(billed)} billed — that's more than the invoice`); return; }
  if(kept.some(r=>!r.reason)&&!confirm('No reason on one of these rows.\n\nThe office will be claiming money back from the supplier — a reason is what they argue with.\n\nSave anyway?')) return;
  saveShort(kept);
}

async function saveShort(rows){
  const l=S.shortLine;
  try{
    await api(`/api/purchases/lines/${l.id}/shortages`,{
      method:'PUT', body:JSON.stringify({rows:rows, recorded_by:S.employee||S.user||''})});
    await reloadGrn();
    S.screen='grndetail'; render();
    const t=shortTotals(rows);
    toast(rows.length ? `✓ ${t.missing?t.missing+' short':t.excess+' extra'} recorded` : '✓ Shortage cleared');
  }catch(e){ toast(e.message); }
}

// ---------- the breakdown editor ----------
function openBreak(line){
  S.grnLine=line; S.sopen={};
  // a row inherits the line's category (or the mapping it would get), so the
  // common case — one category, several sizes — needs no repetition
  const cat=line.category||(line.category_suggestion&&line.category_suggestion.best);
  const blank=()=>blankRow(line.rate,cat);
  if(line.splits.length){
    S.srows=line.splits.map(sp=>{ const r=blank();
      Object.keys(r).forEach(k=>{ if(sp[k]!=null&&sp[k]!=='') r[k]=String(sp[k]); }); return r; });
  } else {
    // The supplier printed the mix in the size column — "30:2, 32:4, 34:4, 36:2"
    // is a count already done by whoever packed the carton. It arrives filled in
    // so the person on the floor CHECKS it against the box instead of re-keying
    // it on a phone. Nothing is saved until they press Save.
    const run=line.size_breakdown;
    if(run&&run.rows&&run.rows.length){
      S.srows=run.rows.map(r=>Object.assign(blank(),{size:String(r.size),qty:String(r.qty),
        mrp:line.mrp!=null?String(line.mrp):'',
        sale_price:line.sale_price!=null?String(line.sale_price):'',
        sale_discount_pct:line.sale_discount_pct!=null?String(line.sale_discount_pct):''}));
      toast(run.matches
        ? `↳ ${run.rows.length} sizes off the invoice · ${run.total} of ${breakTarget(line)} ✓`
        : `↳ ${run.rows.length} sizes off the invoice · ${run.why||'check the quantities'}`);
    } else { S.srows=[blank()]; }
  }
  S.screen='grnbreak'; render();
}

// The target is what ARRIVED, not what was billed — once a shortage is recorded
// the rows only have to reach the received quantity, which is the whole point of
// recording it.
function breakTarget(l){ return +(l.received_qty!=null?l.received_qty:l.qty)||0; }

function updProgress(){
  const l=S.grnLine, target=breakTarget(l), billed=+l.qty||0;
  const assigned=S.srows.reduce((n,r)=>n+(+r.qty||0),0);
  const done=sameQty(assigned,target);
  const left=qtyOf(target-assigned);
  const p=document.getElementById('prog');
  if(p){
    // the breakdown decides what exists, so every piece has to be placed before
    // any of them gets a SKU and a QR — said in full, not as "3 left"
    p.textContent=`${qtyOf(assigned)} of ${qtyOf(target)} ${l.uom||''} assigned`
      +(l.has_shortage?` (${qtyOf(billed)} billed, ${qtyOf(l.missing_qty)} short)`:'')
      +(done?' ✓'
        :left>0?` · ${left} piece${left===1?'':'s'} remaining — complete the size breakdown before posting`
        :` · ${-left} more than were received — remove them`);
    p.style.color=done?'var(--ok)':'var(--warn)';
  }
  const bar=document.getElementById('bar');
  if(bar){
    bar.style.width=Math.min(100,target?(assigned/target)*100:0)+'%';
    bar.style.background=done?'var(--ok)':'var(--accent)';
  }
  // offered here as well as on the line: this is where a receiver first notices
  // the sizes don't add up, and "the rest never came" is a real answer
  const sg=document.getElementById('shortgap');
  if(sg){
    sg.style.display=(!l.has_shortage&&left>0&&assigned>0)?'block':'none';
    sg.textContent=`${left} not in the box? record as shortage →`;
  }
}

function addRow(size){
  if(size&&S.srows.some(r=>r.size===size)){ toast(size+' is already a row — set its quantity'); return; }
  const last=S.srows[S.srows.length-1]||{};
  const cat=last.category||S.grnLine.category||(S.grnLine.category_suggestion&&S.grnLine.category_suggestion.best);
  // a size chip fills the empty row the editor opens with rather than adding a
  // second one below it: an untouched row above the one being typed into is both
  // clutter and a trap — it fails validation at save
  const blank=S.srows.findIndex(r=>!vLabel(r)&&!r.qty);
  if(size&&blank>-1) S.srows[blank].size=size;
  else S.srows.push(Object.assign(blankRow(S.grnLine.rate,cat), size?{size:size}:{}));
  render();
}

function renderBreak(){
  const l=S.grnLine; if(!l){ S.screen='grndetail'; return render(); }
  const rowHtml=(r,i)=>`<div class="prow" style="display:block">
      <div class="row" style="align-items:center;gap:8px">
        <span style="color:var(--muted);font-size:12px;font-weight:700">${i+1}</span>
        <div class="t" style="flex:1;min-width:0">${esc(vLabel(r)||'new item')}</div>

      </div>

        <div style="flex:1.2"><label>Size</label>

        <div style="flex:1"><label>Qty</label>
          <input inputmode="decimal" data-qty="${i}" value="${esc(r.qty)}" placeholder="0" style="padding:10px 12px"></div>
        <button class="btn sec" style="width:auto;padding:11px 13px" data-rest="${i}">rest</button>
      </div>
      <button class="link" style="padding:9px 0;font-size:12px;display:block" data-more="${i}">${S.sopen[i]?'▾ fewer':'▸ colour, material, category, pricing'}</button>
      ${S.sopen[i]?`
        ${SPLIT_ATTRS.filter(([k])=>k!=='size').map(([k,lab])=>k==='design_no'

    const kept=S.srows.filter(r=>vLabel(r)&&+r.qty>0);
    const go=()=>openShort(S.grnLine, qtyOf(breakTarget(l)-assigned));
    if(!kept.length) return go();
    api(`/api/purchases/lines/${l.id}/splits`,{method:'PUT',body:JSON.stringify({rows:kept})})
      .then(reloadGrn).then(()=>{
        S.shortLine=(S.grn.lines.find(x=>x.id===l.id))||l;
        openShort(S.shortLine, qtyOf(breakTarget(l)-assigned));
      }).catch(e=>toast(e.message));
  };
  app.querySelectorAll('[data-size]').forEach(c=>c.onclick=()=>addRow(c.dataset.size));
  document.getElementById('addrow').onclick=()=>addRow(null);
  document.getElementById('duprow').onclick=()=>{
    S.srows.push(Object.assign({},S.srows[S.srows.length-1],{qty:''})); render(); };

  app.querySelectorAll('[data-qty]').forEach(inp=>inp.addEventListener('input',e=>{

  app.querySelectorAll('[data-txt]').forEach(inp=>inp.addEventListener('input',e=>{
    const p=inp.dataset.txt.split(':'), i=+p[0], k=p[1];

    // its box rather than re-rendered, for the reason above: a render mid-
    // keystroke takes the keyboard with it.
    saleCalc(S.srows[i],k);
    ['sale_discount_pct','sale_price'].forEach(o=>{ if(o===k) return;

    const inp=app.querySelector(`[data-qty="${i}"]`); if(inp) inp.value=S.srows[i].qty;
    updProgress();
  });
  app.querySelectorAll('[data-attr]').forEach(b=>b.onclick=()=>{
    const p=b.dataset.attr.split(':'), i=+p[0], k=p[1];
    pickSheet(k.replace('_',' '), S.options[k]||[], S.srows[i][k], (v)=>{ S.srows[i][k]=v; render(); }, true);
  });
  app.querySelectorAll('[data-cats]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.cats;

  });
  const cb=document.getElementById('clearbd');
  if(cb) cb.onclick=()=>{ if(confirm('Clear the breakdown?\n\nThe line goes back to one product for the whole billed quantity.')) saveBreak([]); };
  document.getElementById('savebd').onclick=submitBreak;
}

// The same rules the server enforces, checked here so a picker is told before the
// round trip rather than after it.
function submitBreak(){
  const l=S.grnLine;
  const kept=S.srows.filter(r=>vLabel(r)||r.qty);
  for(const r of kept){
    if(!vLabel(r)){ toast('Every row needs at least one attribute — a size, colour, material…'); return; }
    if(!(+r.qty>0)){ toast(`“${vLabel(r)}”: enter a quantity greater than zero`); return; }
  }
  // identity is the WHOLE attribute tuple, exactly as the server compares it —
  // not the label, which two different tuples can share
  const keys=kept.map(r=>SPLIT_ATTRS.map(([k])=>(r[k]||'').trim().toLowerCase()).join(' '));
  const dup=keys.findIndex((x,i)=>keys.indexOf(x)!==i);
  if(dup>-1){ toast(`“${vLabel(kept[dup])}” appears twice — merge those rows`); return; }
  const assigned=kept.reduce((n,r)=>n+(+r.qty||0),0);
  const target=breakTarget(l);
  // short of the target: say so, and say the thing the receiver may not know —
  // that "the rest never came" is an answer the system will take
  if(kept.length&&!sameQty(assigned,target)
     && !confirm(`The rows add up to ${qtyOf(assigned)} of ${qtyOf(target)}`
        +(l.has_shortage?` received (${qtyOf(l.qty)} billed).`:` billed.`)+`\n\n`
        +(assigned<target&&!l.has_shortage
          ? `If the missing ${qtyOf(target-assigned)} simply weren't in the box, don't invent them — `
            +`save, then use “Something missing or damaged?” to record them as a shortage.\n\n`
          : `That's fine to save and come back to — the GRN just can't be posted until it balances.\n\n`)
        +`Save anyway?`)) return;
  saveBreak(kept);
}

async function saveBreak(rows){
  const btn=document.getElementById('savebd'); if(btn) btn.disabled=true;
  try{
    await api(`/api/purchases/lines/${S.grnLine.id}/splits`,{method:'PUT',body:JSON.stringify({rows:rows})});
    await reloadGrn();
    toast(rows.length?`✓ Broken into ${rows.length} item${rows.length===1?'':'s'}`:'✓ Breakdown cleared');
    S.screen='grndetail'; render();
  }catch(e){ toast(e.message); if(btn) btn.disabled=false; }
}

    const inv=[r.inv_no && ('Inv '+r.inv_no), r.recv_date].filter(Boolean).join(' · ');

// ---------- one consignment: what arrived, and who took it ----------
function renderLRDetail(){
  const r=S.lrSel;
  if(!r){ S.screen='lr'; return render(); }
  const status = (r.mismatches&&r.mismatches.length) ? ['⚠ invoice conflict','var(--warn)']
               : r.matched ? ['✓ invoice linked','var(--ok)']
               : ['invoice pending','var(--muted)'];
  const fields = [

    ['Paid / ToPay', r.paid_topay],
    ['Freight', r.freight_amount!=null?('₹ '+money(r.freight_amount)):''],
  ].filter(([,v])=>v!==null&&v!==''&&v!==undefined);
  const line=([k,v])=>`<div style="display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)">
      <span style="color:var(--muted);font-size:13px">${esc(k)}</span>
      <span style="text-align:right;font-weight:600">${esc(v)}</span></div>`;

  app.innerHTML=`<div class="topbar"><button class="link" id="back">‹ Back</button><h1></h1></div>
    <div class="detwrap">
      <div class="detname">${esc(r.supplier_name||'(no supplier)')}</div>
      <div class="detmeta">${esc([r.transport, r.lr_no&&('LR '+r.lr_no)].filter(Boolean).join(' · '))}</div>
      <div class="detmeta" style="color:${status[1]}">${status[0]}</div>
      <div style="height:10px"></div>
      ${fields.map(line).join('')}
      <div style="height:16px"></div>
      ${r.received_by?`<div class="hint" style="color:var(--ok);margin-bottom:8px">Already received by ${esc(r.received_by)}</div>`:''}
      <div class="field"><label>Received by (who took the packages)</label>
        <input id="rby" list="rnames" placeholder="e.g. Ramesh" value="${esc(r.received_by||S.employee||'')}"></div>
      <datalist id="rnames">${(S.receivers||[]).map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>
      <button class="btn" id="rcv">${r.received_by?'Update receiver':'Receive consignment'}</button>
      ${r.received_by?`<button class="btn" id="undo" style="margin-top:10px;background:var(--panel2);color:var(--muted)">Undo receipt</button>`:''}
      <div style="height:30px"></div>
    </div>`;

  document.getElementById('back').onclick=()=>{ S.screen='lr'; render(); };
  document.getElementById('rcv').onclick=async ()=>{
    const name=document.getElementById('rby').value.trim();
    if(!name){ toast('Enter who received it'); return; }
    document.getElementById('rcv').disabled=true;
    try{
      await api(`/api/lr/${r.id}/receive`,{method:'POST',body:JSON.stringify({received_by:name})});
      // remember the last name typed — usually the same person receives all day
      S.employee=name; localStorage.setItem('essa_emp',name);
      await loadReceivers();
      toast('✓ Received by '+name);
      S.screen='lr'; render();
    }catch(e){ toast('Could not save: '+e.message); document.getElementById('rcv').disabled=false; }
  };
  const un=document.getElementById('undo');
  if(un) un.onclick=async ()=>{
    if(!confirm('Undo this receipt? The consignment goes back to pending.')) return;
    try{ await api(`/api/lr/${r.id}/receive`,{method:'DELETE'});
      toast('✓ Back to pending'); S.screen='lr'; render();
    }catch(e){ toast('Could not undo: '+e.message); }
  };
}

async function loadReceivers(){

// ---------- notifications: the warehouse's open queues, on the phone ----------
// The same feed as the desktop bell, read and acknowledged through the same
// endpoints — a notice cleared on the floor is cleared in the office, because it
// is one queue and it has been seen.
//
// Which of them can be acted on HERE is not the same set: the phone receives
// consignments, breaks down receipts and details products, so those notices jump
// to a screen. A debit note or a supplier payment has no phone screen to jump
// to, and saying so is better than a tap that goes nowhere.
const NOTIF_SCREEN = {
  'lr.pending':'lr', 'lr.unlinked':'lr',
  'grn.draft':'grn', 'grn.shortage':'grn',

  // usually lands after that screen has already been drawn — so repaint it, but
  // only when the number actually changed and never over a screen being typed on
  if((S.notifCounts.unread||0)!==before && ['list','lr','grn','bundles'].includes(S.screen)) render();
}

async function paintNotifs(){
  let feed;
  try{ feed = await api('/api/notifications'); }
  catch(e){ feed = {notices:[], counts:{}}; toast('Could not read the notifications'); }

  S.notifCounts = feed.counts || {};
  const cnt=document.getElementById('ncnt');
  if(cnt) cnt.textContent = (S.notifCounts.unread||0) + ' unread';
  const list=document.getElementById('nlist'); if(!list) return;

          <div class="m">${esc(n.body)}</div>
          <div class="m" style="color:var(--muted)">${n.waiting?'waiting '+esc(n.waiting):''}${
            n.read_by?' · read by '+esc(n.read_by):''}</div>
        </div>
      </div>
      <div class="row" style="gap:8px;margin-top:10px">
        ${NOTIF_SCREEN[n.key]?`<button class="btn sec" data-go="${i}">Open</button>`:''}

      </div>
    </div>`).join('');

      paintNotifs();
    }catch(e){ toast('Could not mark it read'); }
  });

// ---------- scan an LR on the dock ----------
// The desk imports a whole register page; here it is usually the single LR copy
// the driver just handed over — the consignment that has no register line yet
// because nobody has been back to a desk. It goes through the SAME extraction,
// the same duplicate check and the same /api/lr/save as the desktop import, so
// the row is on the desktop register the moment it is filed, and a page already
// imported at the desk cannot be entered a second time from the floor.
//
// Only what a docket actually prints is offered for correction. Purchase
// manager, stock holding days and the rest are office decisions — they are not
// on the paper in the scanner's hand, so they are not asked for here.
const LR_SCAN_FIELDS = [
  ['supplier_name','Supplier','text'], ['transport','Transport','text'],
  ['lr_mode','LR mode','text'], ['agent','Agent','text'],
  ['lr_no','LR No','text'], ['lr_date','LR date','date'],
  ['recv_date','Received date','date'],
  ['inv_no','Invoice No','text'], ['inv_date','Invoice date','date'],
  ['item','Item','text'],
  ['bundle','Bundles','num'], ['boxes','Boxes','num'], ['qty','Pieces','num'],
  ['amount','Goods value','num'],
  ['paid_topay','Paid / ToPay','pt'],
  ['freight_amount','Freight','num'], ['freight_total','Total charges','num'],
];
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

// Each choice here is a REAL file input lying invisibly over its row, so the
// finger lands on the input itself. Nothing is clicked from script: a phone
// browser only opens a file chooser for a genuine tap, and it stops counting the
// tap as genuine once the handler has torn down the element that was tapped —
// which is exactly what closing this sheet first used to do. Nothing happened,
// with no error to show for it.
function startLRScan(){
  // The in-app camera needs getUserMedia, and a browser only grants that on
  // https (or localhost). Served over plain http on the LAN — which is how the
  // warehouse reaches this — it is not on offer, so the row becomes the phone's
  // own camera app instead of a button that could only fail.
  const inApp = !!(window.isSecureContext && navigator.mediaDevices
                   && navigator.mediaDevices.getUserMedia);
  const fileRow = (label, accept, capture) => `<label class="opt pickrow">${label}
      <input type="file" accept="${accept}"${capture?' capture="environment"':''}></label>`;
  const sh=document.createElement('div'); sh.className='sheet';
  const env = envReport();
  sh.innerHTML=`<div class="sheetcard">
    <div class="sheethd"><span>Scan an LR</span><button class="link" id="x">×</button></div>
    ${inApp ? `<div class="opt" id="cam">📷 Take a photo</div>`
            : fileRow('📷 Take a photo','image/*',true)}
    ${fileRow('🖼 Choose a photo or PDF','image/*,application/pdf',false)}
    ${env.webview
      ? `<div class="opt" id="diag" style="color:var(--warn);font-size:13px">
           ⚠️ This is the wrapper app — it may block the camera. Tap to check</div>`
      : `<div class="opt" id="diag" style="color:var(--muted);font-size:13px">
           ⓘ Nothing opening? Check this device</div>`}
  </div>`;
  document.body.appendChild(sh);
  const close=()=>sh.remove();
  sh.querySelector('#x').onclick=close;
  sh.onclick=(e)=>{ if(e.target===sh) close(); };
  const cam=sh.querySelector('#cam');
  if(cam) cam.onclick=()=>{ close(); capturePhoto(readLRFile); };
  sh.querySelector('#diag').onclick=()=>{
    close(); S.diagBack='lr'; S.screen='diag'; render();
  };
  // a tap that opens nothing must not pass in silence — see watchChooser
  sh.querySelectorAll('label.pickrow').forEach(lab=>lab.addEventListener('click', watchChooser));
  // a picture chosen here goes through the same shrink as one taken in the app;
  // a PDF passes through untouched
  sh.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async ()=>{
    const f=inp.files&&inp.files[0];
    close();
    if(!f) return;
    const small=await shrinkImage(f);
    readLRFile(small, small===f ? f.name : 'lr-photo.jpg');
  });
}

async function readLRFile(file, name){
  S.lrScan=null; S.lrScanOpen={}; S.lrScanBusy=true; S.screen='lrscan'; render();
  try{
    const r = await upload('/api/lr/extract', file, name);
    const rows = (r.rows||[]).map(x=>Object.assign({},x));
    if(!rows.length){
      // an empty read is a bad photo, not an empty page — say so instead of
      // showing a review screen with nothing on it
      toast('Nothing could be read — try again in better light');
      S.lrScanBusy=false; S.screen='lr'; return render();
    }
    S.lrScan={document_id:r.document_id, rows:rows, note:r.note||'', dup:r.duplicates||null};
    // a single docket opens ready to check; a whole register page stays collapsed
    S.lrScanOpen = rows.length===1 ? {0:true} : {};
  }catch(e){
    toast('Could not read it: '+e.message);
    S.lrScanBusy=false; S.screen='lr'; return render();
  }
  S.lrScanBusy=false; render();
}

function lrScanField(r,i,k,label,type){
  const v = r[k]==null?'':r[k];
  if(type==='pt'){
    const cur=String(v).toUpperCase();
    const opts=['','PAID','TOPAY','NO'];
    if(cur && opts.indexOf(cur)<0) opts.push(cur);   // keep a word the page used
    return `<div class="field"><label>${label}</label><select data-i="${i}" data-k="${k}">${
      opts.map(o=>`<option value="${esc(o)}" ${cur===o?'selected':''}>${o||'—'}</option>`).join('')}</select></div>`;
  }
  // a date the page wrote in some other form is left as free text rather than
  // handed to a date picker that would show it blank and lose it on the way out
  const asDate = type==='date' && (v==='' || ISO_DATE.test(v));
  return `<div class="field"><label>${label}</label><input data-i="${i}" data-k="${k}"${
    asDate?' type="date"':''}${type==='num'?' inputmode="decimal"':''}${
    type==='date'&&!asDate?' placeholder="YYYY-MM-DD"':''} value="${esc(v)}"></div>`;
}

function renderLRScan(){
  if(S.lrScanBusy){
    app.innerHTML=`<div class="topbar"><h1>Reading the LR…</h1></div>
      <div class="center"><div class="spin"></div>
        <p style="color:var(--muted);font-size:14px;text-align:center">Reading the docket — a few seconds.</p></div>`;
    return;
  }
  const sc=S.lrScan;
  if(!sc){ S.screen='lr'; return render(); }
  const keep=sc.rows.filter(r=>r._status!=='duplicate');
  const cards=sc.rows.map((r,i)=>{
    const open=!!S.lrScanOpen[i];
    const dupd=r._status==='duplicate', doubt=r._status==='doubtful';
    const badge = dupd?['already filed','bdup'] : doubt?['check','bpend'] : ['new','bdone'];
    const bits=[r.transport, r.lr_no&&('LR '+r.lr_no), r.bundle&&(r.bundle+' bundle'),
                r.qty&&(r.qty+' pcs'), r.amount!=null&&('₹ '+money(r.amount))].filter(Boolean);
    return `<div class="prow" style="display:block${dupd?';opacity:.6':''}">
      <div style="display:flex;align-items:center;gap:10px" data-open="${i}">
        <div style="flex:1;min-width:0">
          <div class="t">${esc(r.supplier_name||'(no supplier)')}</div>
          <div class="m">${esc(bits.join(' · '))}</div>
          ${dupd?`<div class="m" style="color:var(--danger)">identical to a consignment already on the register — it will be skipped</div>`:''}
          ${doubt&&r._diffs&&r._diffs.length?`<div class="m" style="color:var(--warn)">same LR/invoice as a filed row, but ${esc(r._diffs.join(', '))} differ${r._diffs.length===1?'s':''} — check before filing</div>`:''}
          ${r.source_language?`<div class="m">🌐 read in ${esc(r.source_language)} and translated</div>`:''}
        </div>
        <div class="badge ${badge[1]}">${badge[0]}</div>
      </div>
      ${open?`<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
        ${LR_SCAN_FIELDS.map(([k,l,t])=>lrScanField(r,i,k,l,t)).join('')}
        <button class="btn sec" data-del="${i}">Remove this row</button>
      </div>`:''}
    </div>`;
  }).join('');

  app.innerHTML=`<div class="topbar"><button class="link" id="back">‹ Back</button>
      <h1>Check &amp; file</h1><span class="count">${sc.rows.length} read</span></div>
    <div class="list" style="padding-top:12px">
      <div class="hint" style="margin-bottom:10px">Tap a consignment to correct what was read. What you file here lands on the desktop LR register straight away.</div>
      ${sc.note?`<div class="hint" style="margin-bottom:10px">${esc(sc.note)}</div>`:''}
      ${cards}
      <div style="height:10px"></div>
    </div>
    <div class="actionbar">
      <button class="btn" id="lrsave"${keep.length?'':' disabled'}>File ${keep.length} consignment${keep.length===1?'':'s'}</button>
    </div>`;

  document.getElementById('back').onclick=()=>{
    if(!confirm('Discard what was read from this photo?')) return;
    S.lrScan=null; S.lrScanOpen={}; S.screen='lr'; render();
  };
  app.querySelectorAll('[data-open]').forEach(h=>h.onclick=()=>{
    const i=h.dataset.open; S.lrScanOpen[i]=!S.lrScanOpen[i]; render();
  });
  // edits land straight on the row object, so opening or closing another card
  // never throws away a correction that hasn't been filed yet
  app.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{
    sc.rows[+el.dataset.i][el.dataset.k]=el.value;
  }));
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    sc.rows.splice(+b.dataset.del,1); S.lrScanOpen={};
    if(!sc.rows.length){ S.lrScan=null; S.screen='lr'; }
    render();
  });
  document.getElementById('lrsave').onclick=async (e)=>{
    // exact duplicates are dropped here and re-checked on the server, so a page
    // photographed twice on the floor still cannot double-file a consignment
    const clean=sc.rows.filter(r=>r._status!=='duplicate');
    if(!clean.length){ toast('Nothing new — these are already on the register'); return; }
    e.target.disabled=true;
    try{
      const res=await api('/api/lr/save',{method:'POST',
        body:JSON.stringify({document_id:sc.document_id, rows:clean})});
      toast('✓ Filed '+res.saved+' consignment'+(res.saved===1?'':'s')
            +(res.skipped_duplicates?' · '+res.skipped_duplicates+' already there':''));
      S.lrScan=null; S.lrScanOpen={}; S.lrFilter='pending'; S.screen='lr'; render();
    }catch(err){ toast('Could not file it: '+err.message); e.target.disabled=false; }
  };
}

function renderDetail(){

  const f=Object.assign({mrp:p.mrp??'',sale_price:p.sale_price??'',sale_discount_pct:p.sale_discount_pct??''},

        ? 'category <b>'+esc(p.category)+'</b>'+(p.category_section?' ('+esc(p.category_section)+')':'')

      <div class="field"><label>Design No</label><input id="design_no" value="${esc(f.design_no)}" placeholder="e.g. SH-05"></div>
      <!-- MRP → Discount % → Sale price, in the order the price is worked out.
           Type either of the last two and the other fills itself. -->
      <div class="row">
        <div class="field" style="flex:1"><label>MRP</label><input id="mrp" inputmode="decimal" value="${esc(f.mrp)}"></div>
        <div class="field" style="flex:1"><label>Discount %</label><input id="sale_discount_pct" inputmode="decimal" value="${esc(f.sale_discount_pct)}"></div>

  // back to whichever list opened this: the Products tab, or the receipt's

  app.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>openSheet(b.dataset.sel,f,b));
  // MRP − Discount % = Sale price, both ways. Same arithmetic the desktop runs,

  const SALE_IDS=['mrp','sale_discount_pct','sale_price'];
  SALE_IDS.forEach(id=>{ const el=document.getElementById(id); if(!el) return;
    el.addEventListener('input',()=>{
      const row={}; SALE_IDS.forEach(x=>{ row[x]=document.getElementById(x).value; });

  document.getElementById('save').onclick=async ()=>{

    // save without a second list needing to be remembered
    const body=Object.assign(Object.fromEntries(SPLIT_ATTRS.map(([k])=>[k,f[k]||''])),{

      mrp:num(document.getElementById('mrp').value),sale_price:num(document.getElementById('sale_price').value),
      sale_discount_pct:num(document.getElementById('sale_discount_pct').value),detailed_by:S.employee||'mobile'});
    document.getElementById('save').disabled=true;
    try{ await api(`/api/inventory/products/${p.id}/detail`,{method:'POST',body:JSON.stringify(body)});
      toast('✓ Saved · QR confirmed');
      // re-read the receipt so the item ticks over to "detailed"
      if(S.detailBack==='grnposted'&&S.grn){ try{ await reloadGrn(); }catch(e){} }
      if(S.detailBack==='bundle'&&S.bundle){ try{ await reloadBundle(); }catch(e){} }
      S.screen=S.detailBack||'list'; render(); }
    catch(e){ toast('Save failed: '+e.message); document.getElementById('save').disabled=false; }
  };
}

function openSheet(key,f,btn){
  pickSheet(key.replace('_',' '), S.options[key]||[], f[key], (v)=>{
    f[key]=v; btn.textContent=v||'Select…'; btn.classList.toggle('empty',!v);
  });
}

// One box, two jobs: it filters the list as you type and it is also how a value
// that isn't in the list gets used. The category master runs to hundreds of
// names — scrolling that on a phone is not a thing anyone does twice.
function pickSheet(title, options, current, onPick, allowClear){
  const opts=(options||[]).slice();
  const sh=document.createElement('div'); sh.className='sheet';
  sh.innerHTML=`<div class="sheetcard">
    <div class="sheethd"><span>${esc(title)}</span><button class="link" id="x">×</button></div>
    <div class="row" style="padding:10px 12px;gap:8px"><input id="cst" placeholder="Type to search, or enter your own…"><button class="btn" style="width:auto;padding:12px 16px" id="use">Use</button></div>
    ${allowClear&&current?`<div class="opt" id="clr" style="color:var(--muted)">— clear —</div>`:''}
    <div style="overflow:auto" id="opts"></div>
  </div>`;
  document.body.appendChild(sh);
  const pick=(v)=>{ sh.remove(); onPick(v); };
  const paintOpts=(q)=>{
    const t=(q||'').trim().toLowerCase();
    const shown=t?opts.filter(o=>String(o).toLowerCase().includes(t)):opts;
    sh.querySelector('#opts').innerHTML = shown.length
      ? shown.map(o=>`<div class="opt ${o===current?'sel':''}" data-o="${esc(o)}">${esc(o)}</div>`).join('')
      : `<p style="color:var(--muted);padding:16px;font-size:14px">Nothing matches — tap Use to enter it anyway.</p>`;
    sh.querySelectorAll('.opt[data-o]').forEach(o=>o.onclick=()=>pick(o.dataset.o));
  };
  paintOpts('');
  sh.querySelector('#x').onclick=()=>sh.remove();
  sh.onclick=(e)=>{ if(e.target===sh) sh.remove(); };
  const clr=sh.querySelector('#clr'); if(clr) clr.onclick=()=>pick('');
  sh.querySelector('#cst').addEventListener('input',e=>paintOpts(e.target.value));
  sh.querySelector('#use').onclick=()=>{ const v=sh.querySelector('#cst').value.trim(); if(v) pick(v); };
}
</script>

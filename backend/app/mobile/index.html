<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B3D2E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ESSA AI" />
<link rel="manifest" href="/m/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/m/icon.png" />
<title>ESSA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Inter + JetBrains Mono, fetched without holding up the first paint: a
     warehouse phone on a LAN with no internet renders straight away in the
     system font (the fallbacks in --font / --mono) instead of a blank screen. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
<style>
/* ESSA design tokens. The screens below reference these variables inline
   (var(--accent), var(--warn), var(--ok)…), so the palette lives here and nowhere
   else. --chrome is the dark forest green of the header and primary buttons;
   --accent the green of focus rings, active markers and progress. */
:root{--bg:#F7F9F7;--panel:#FFFFFF;--panel2:#E7F4EC;--line:#DCE5DF;--line2:#DCE5DF;--text:#17221D;--muted:#68756E;
  --chrome:#0B3D2E;--chrome2:#082C21;--chrome3:#124234;
  --accent:#2F8F68;--accent2:#257353;--tint:#E7F4EC;--tint2:#D5EFE0;
  --ok:#257353;--okbg:#E7F4EC;--warn:#B45309;--warnbg:#FFFBEB;--danger:#E11D48;--dangerbg:#FFF1F2;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.03)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.35;letter-spacing:-0.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
#app{min-height:100%;display:flex;flex-direction:column}
.pad{padding:env(safe-area-inset-top) 0 0 0}
input,select,button,textarea{font:inherit;color:var(--text);letter-spacing:inherit}
/* 16px in the box itself: anything smaller and iOS zooms the page on focus */
input,select{width:100%;min-height:44px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:16px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--muted);opacity:.6}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
label{display:block;color:var(--text);font-size:12px;font-weight:600;margin:0 0 5px}
.field{margin-bottom:14px}
.btn{width:100%;min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;background:var(--chrome);border:1px solid transparent;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;line-height:1.2;color:#fff;box-shadow:var(--shadow);cursor:pointer;transition:background-color .15s,border-color .15s}
.btn:active{background:var(--chrome2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--panel);border-color:var(--line);color:var(--text)}
.btn.sec:active{background:var(--bg)}
@media (hover:hover){.btn:hover{background:var(--chrome2)}.btn.sec:hover{background:var(--bg)}}
.btn:focus-visible,.scanbig:focus-visible,.chip:focus-visible,.link:focus-visible,.selbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px}
/* the design's logo chip — a white E on the accent green */
.logo{width:56px;height:56px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.logo::before{content:"E";font-size:28px;letter-spacing:.02em}
.brand{font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:14px 0 20px;color:var(--text)}
.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:12px;margin:4px 0 20px}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.err{color:var(--danger);font-size:13px;text-align:center;margin:6px 0}
/* the header: dark forest chrome, logo chip, white title, header controls */
.topbar{position:sticky;top:0;z-index:5;background:var(--chrome);color:#fff;border-bottom:1px solid var(--chrome2);min-height:calc(56px + env(safe-area-inset-top));padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px}
.topbar::before{content:"E";flex:0 0 32px;width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;letter-spacing:.02em;box-shadow:var(--shadow)}
.topbar h1{font-size:16px;font-weight:700;letter-spacing:-0.015em;line-height:1.25;margin:0;flex:1;min-width:0;color:#fff;overflow-wrap:anywhere}
.topbar .count{color:rgba(231,244,236,.8);font-size:11px;font-family:var(--mono);white-space:nowrap}
.link{color:var(--chrome);font-size:13px;font-weight:600;background:none;border:none;padding:6px;border-radius:8px;cursor:pointer}
.link:active{background:var(--tint)}
.topbar .link{color:#fff;background:var(--chrome2);border:1px solid rgba(47,143,104,.3);min-height:40px;padding:0 12px;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center}
.topbar .link:active{background:var(--chrome3)}
@media (hover:hover){.topbar .link:hover{background:var(--chrome3)}}
button.link[data-drop],button.link[data-del],button.link[data-shdel]{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
/* the context bar under the header: white, divided from the list below */
.controls{padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.controls+.controls{margin-top:-1px;padding-top:0}
.controls+.list{padding-top:12px}
.row{display:flex;gap:8px}
/* A flex item defaults to min-width:auto, so a 100%-wide <input> beside two
   buttons refuses to shrink below its intrinsic size and pushes the whole
   page wider than the phone — every row then sits shifted with its right
   edge off-screen. Letting row children shrink is the fix. */
.row>*{min-width:0}
.row[data-item]{cursor:pointer}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:40px;padding:0 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);text-transform:capitalize;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow)}
.chip:active{background:var(--tint);color:var(--chrome)}
.chip.on{background:var(--chrome);border-color:var(--chrome);color:#fff;font-weight:600}
.chip[id$="refresh"]{font-size:18px;min-width:40px;padding:0 10px}
.chip b{font-family:var(--mono);font-size:10px;font-weight:600;line-height:1;padding:3px 5px;border-radius:6px;background:#FFFBEB;color:#78350F;border:1px solid #FDE68A}
/* the screen switcher as the design's segmented control */
.row:has(>.chip[data-tab]){background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px!important}
.row:has(>.chip[data-tab])>.chip{background:transparent;border-color:transparent;border-radius:6px;box-shadow:none;padding:0 12px}
.row:has(>.chip[data-tab])>.chip.on{background:var(--chrome);border-color:var(--chrome);color:#fff}
/* camera scanner overlay */
.scanov{position:fixed;inset:0;z-index:90;background:#000;display:flex;align-items:center;justify-content:center}
.scanov video{width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;width:68vw;height:68vw;max-width:320px;max-height:320px;
  border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scanhint{position:absolute;bottom:120px;left:0;right:0;text-align:center;color:#fff;
  font-size:15px;text-shadow:0 1px 4px #000;padding:0 24px}
.scanx{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);min-height:48px;
  background:#fff;color:var(--text);border:none;border-radius:12px;padding:13px 30px;font-size:15px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.08)}
/* the shutter for a document photo — thumb-sized and in the middle, where a
   camera app puts it, so nobody has to look for it while holding a docket flat */
.shutter{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
  width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.5)}
.shutter:active{background:#cfcfcf}
.list{flex:1;overflow:auto;padding:0 14px 24px}
.list>p{font-size:13px;padding:0 12px}
/* list rows as the design's mobile cards */
.prow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .15s,background-color .15s}
.prow[data-i],.prow[data-wh],.prow[data-item]{cursor:pointer}
.prow[data-i]:active,.prow[data-wh]:active,.prow[data-item]:active{background:var(--bg);border-color:var(--accent)}
@media (hover:hover){.prow[data-i]:hover,.prow[data-wh]:hover,.prow[data-item]:hover{border-color:var(--accent)}}
.prow .t{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.prow .m{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.prow label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
/* status badges: success / pending / danger groups, mono, with a leading dot */
.badge{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-family:var(--mono);font-size:10px;font-weight:500;line-height:1.3;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.badge::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.bpend{background:#FFFBEB;color:#78350F;border-color:#FDE68A}
.bdone{background:#E7F4EC;color:#0B3D2E;border-color:rgba(47,143,104,.3)}
.bdup{background:#FFF1F2;color:#9F1239;border-color:#FECDD3}
/* --- stock audit ----------------------------------------------------------
   The scan button is the screen. Someone is holding the phone in one hand and a
   garment in the other, so it is a thumb-sized target at the top rather than a
   control among controls. */
.scanbig{width:100%;min-height:72px;padding:22px;font-size:18px;font-weight:700;border:none;
  border-radius:12px;background:var(--chrome);color:#fff;letter-spacing:.03em;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer}
.scanbig:active{background:var(--chrome2)}
.scanbig:disabled{opacity:.5}
/* The tally. Three figures, and the two that matter are coloured — but each
   carries its WORD underneath, because a count read at arm's length under
   warehouse lighting cannot depend on telling two pastels apart. */
.tally{display:flex;gap:8px;margin-top:10px}
.tally>div{flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
.tally .n{font-size:24px;font-weight:700;line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:var(--text)}
.tally .l{font-size:11px;font-weight:600;color:var(--muted);margin-top:6px;text-transform:uppercase;
  letter-spacing:.04em}
.tally .ok .n{color:var(--ok)} .tally .no .n{color:var(--danger)}
/* The verdict on the scan just taken — the thing the person is looking at, so
   it is big, coloured AND worded, and it sits above the running list. */
.verdict{border-radius:12px;padding:14px 16px;margin-top:12px;border:1px solid}
.verdict .big{font-size:20px;font-weight:700;letter-spacing:-0.01em}
.verdict .det{font-size:13px;margin-top:6px;line-height:1.5}
.vok{background:#E7F4EC;border-color:var(--accent);color:#0B3D2E}
.vno{background:#FFF1F2;border-color:#FDA4AF;color:#9F1239}
.vunk{background:#FFFBEB;border-color:#FCD34D;color:#78350F}
.verdict .det{color:var(--text)}
.arow{border-left:4px solid var(--line)}
.arow.ok{border-left-color:var(--accent)}
.arow.no{border-left-color:var(--danger)}
.arow.unk{border-left-color:#D97706}
.detwrap{flex:1;overflow:auto;padding:16px}
.detname{font-size:20px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:var(--text)}
.detmeta{color:var(--muted);font-size:13px;margin-top:4px}
/* pickers slide up as the design's bottom sheet */
.sheet{position:fixed;inset:0;background:rgba(11,61,46,.4);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:flex;align-items:flex-end;z-index:20}
.sheetcard{background:var(--panel);width:100%;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 10px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.05)}
.sheetcard::before{content:"";flex:0 0 auto;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto}
.sheethd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 8px 16px;background:var(--bg);border-bottom:1px solid var(--line);font-size:15px;font-weight:700;color:var(--text)}
.sheethd .link{min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:22px;font-weight:400;line-height:1;color:var(--muted)}
.sheethd .link:active{background:var(--tint);color:var(--text)}
.opt{padding:14px 18px;min-height:48px;border-bottom:1px solid var(--line);font-size:15px;font-weight:400;color:var(--text);cursor:pointer}
.opt:active{background:var(--bg)}
.opt.sel{background:var(--tint);color:var(--chrome);font-weight:600;box-shadow:inset 4px 0 0 var(--accent)}
/* a sheet row that IS a file input: a <label>, so a tap anywhere on the row
   activates it, with the input itself lying invisibly over the row so a tap that
   lands on the control opens the chooser too. Both, because a phone browser
   gives a file input only a small live area of its own — and the plain label
   rules would otherwise repaint this row as a muted little form caption. */
.opt.pickrow{display:block;position:relative;overflow:hidden;margin:0;color:var(--text);font-size:15px;font-weight:400}
.opt.pickrow input{position:absolute;left:0;top:0;width:100%;height:100%;min-height:0;
  opacity:0;padding:0;border:0;border-radius:0;background:none;box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--panel);color:var(--text);border:1px solid rgba(47,143,104,.3);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:12px 16px;z-index:40;font-size:13px;font-weight:500;line-height:1.4}
/* A new alert, while the app is open. Across the top and over the safe area,
   where a phone's own notification would have been — this is standing in for one. */
.alertbar{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--chrome);color:#fff;border-bottom:1px solid var(--chrome2);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.alertbar span{flex:1}
.alertbar .link{background:var(--chrome2);border:1px solid rgba(47,143,104,.3);min-height:36px;padding:0 12px;font-weight:500}
.alertbar .link:active{background:var(--chrome3)}
.hint{color:var(--muted);font-size:11px;margin-top:2px;line-height:1.45}
.selbtn{position:relative;width:100%;min-height:44px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;padding-right:34px!important;font-size:15px;color:var(--text);box-shadow:var(--shadow);cursor:pointer}
.selbtn::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;margin-top:-6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg)}
.selbtn:active{border-color:var(--accent)}
.selbtn.empty{color:var(--muted)}
.spin{border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;width:26px;height:26px;animation:sp 1s linear infinite;margin:30px auto}
/* the breakdown's progress: forest green while filling, the success green once it balances */
#bar{--accent:var(--chrome);border-radius:3px;transition:width .2s}
/* the bar that carries the one action a screen commits to (post, save) */
.actionbar{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);box-shadow:0 -4px 12px rgba(0,0,0,.04)}
.actionbar .m{color:var(--muted);font-size:12px;line-height:1.45}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div></div></div>
<script>
const S = { token: localStorage.getItem('essa_token')||'', user: localStorage.getItem('essa_user')||'',
            // The access level this account signs in at — user, admin or
            // superadmin. Read back from the server on every verify rather than
            // trusted from storage, so a level changed on the desktop takes
            // effect the next time the phone opens rather than at the next
            // sign-in. See backend/app/services/users.py for what each means.
            role: localStorage.getItem('essa_role')||'',
            // The building this handset is standing in. Every call carries it as
            // a header — see api() — because the server narrows almost every
            // screen on it (backend/app/services/scope.py). Without one, a list
            // comes back company-wide and a count refuses to start at all.
            //
            // Same storage key and same shape as the desktop's own picker
            // (frontend/src/api.js), so a phone and a browser on the same
            // machine describe the building identically.
            warehouse: (()=>{ try{ return JSON.parse(localStorage.getItem('essa_warehouse')||'null'); }
                              catch(e){ return null; } })(),
            warehouses:[],
            screen:'login', products:[], options:{}, status:'pending', q:'', barcode:'', selected:null, employee: localStorage.getItem('essa_emp')||'',
            // the notification centre — the same queues the desktop bell carries
            notifs:[], notifCounts:{},
            // consignments waiting to be taken in (LR register rows)
            lr:[], lrFilter:'pending', lrSel:null, receivers:[],
            // an LR copy / register page photographed on the dock, read but not yet filed
            lrScan:null, lrScanOpen:{}, lrScanBusy:false,
            // goods receipts: the bundle a supplier billed, broken into what arrived
            grns:[], grnFilter:'draft', grn:null, grnLine:null, srows:[], sopen:{},
            cats:[], postResult:null,
            // shortage entry: what was billed and wasn't in the box
            shortLine:null, shrows:[], shortOpts:null,
            // cartons: the first label, printed at GRN and scanned around the warehouse
            bundles:[], bundleFilter:'stored', bundle:null, locations:[] };
const app = document.getElementById('app');
const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (v)=> v==null?'—': Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});

// Ranked, matching backend/app/services/users.py. Compared by rank rather than
// by equality so an admin is never refused a floor screen for not being a user.
const ROLE_RANK = { user:1, admin:2, superadmin:3 };
const ROLE_LABEL = { user:'User', admin:'Admin', superadmin:'Super Admin' };
const atLeast = (need) => (ROLE_RANK[S.role]||0) >= (ROLE_RANK[need]||0);

// Every call goes through here, and every call carries the token. The server
// refuses anything that does not — the phone is on the warehouse wifi, which is
// not a trusted network just because it is indoors.
async function api(path, opts){
  const h = Object.assign({'Content-Type':'application/json'}, (opts||{}).headers||{});
  if(S.token) h['X-Essa-Token'] = S.token;
  // …and WHICH BUILDING it is being made inside. Set here, in the one funnel
  // every call passes through, rather than threaded into the fifty places that
  // make one: a screen that forgot would not look broken, it would look like
  // another warehouse's work had appeared in yours. Endpoints that are
  // company-wide by nature simply ignore it.
  if(S.warehouse && S.warehouse.id) h['X-Essa-Warehouse'] = String(S.warehouse.id);
  const r = await fetch(path, Object.assign({}, opts||{}, {headers:h}));
  const j = await r.json().catch(()=>({}));
  if(!r.ok){
    // 401 is an expired or revoked token — including an account a super admin
    // deactivated while the phone was in someone's pocket. Drop to the login
    // screen rather than showing "HTTP 401" over a half-counted GRN.
    if(r.status===401 && !path.startsWith('/api/auth/')) signedOut();
    throw new Error(j.detail || ('HTTP '+r.status));
  }
  return j;
}
function signedOut(){
  localStorage.removeItem('essa_token');
  S.token=''; S.role=''; S.screen='login'; render();
  toast('Signed out — please sign in again');
}
// A file goes up as multipart — deliberately NOT through api(), which stamps
// every request as JSON. Setting Content-Type by hand here would drop the
// boundary the server needs to find the file at all, so it is left unset.
async function upload(path, file, name){
  const fd=new FormData();
  // the filename carries the extension, and the server reads the extension to
  // tell the vision API what it is being sent — a blob posted nameless arrives
  // as ".bin" and is described to the API as a guess
  fd.append('file', file, name || file.name || 'upload.jpg');
  // The token and the warehouse still go up: only Content-Type is left to the
  // browser here, and an upload is as much a write as anything api() sends — an
  // LR copy photographed on the dock is filed against the building it was
  // photographed in.
  const h = {};
  if(S.token) h['X-Essa-Token'] = S.token;
  if(S.warehouse && S.warehouse.id) h['X-Essa-Warehouse'] = String(S.warehouse.id);
  const r=await fetch(path,{method:'POST',body:fd,headers:h});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===401) signedOut();
    throw new Error(j.detail || ('HTTP '+r.status));
  }
  return j;
}
// Opens the phone's own camera app (capture) or the file picker, and hands back
// what was chosen. The input is built and clicked inside the tap that called
// this — a phone browser only honours a file dialog opened from a real gesture.
function chooseFile(accept, capture, cb){
  // a dialog the user backed out of leaves its input behind — there is no
  // "cancelled" event to hang cleanup on, so the next call clears the last one
  document.querySelectorAll('input.hiddenpick').forEach(x=>x.remove());
  const inp=document.createElement('input');
  inp.className='hiddenpick';
  inp.type='file'; inp.accept=accept;
  // set as an ATTRIBUTE: the `capture` IDL property is not reflected on every
  // phone browser, and where it isn't, assigning it silently does nothing
  if(capture) inp.setAttribute('capture','environment');
  // off-screen rather than display:none — a hidden input is one some browsers
  // decline to open
  inp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(inp);
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove(); if(f) cb(f); };
  inp.click();
}

// ---- what this device can actually do --------------------------------------
// Three things silently do nothing on a phone and every one of them has been
// reported as "the app is broken": a file input inside an app shell that never
// implemented the chooser, a camera on a page served over plain http, and a push
// banner with no service worker behind it. None of them raises an error, so the
// app has to be able to say which of them applies.
function envReport(){
  const ua = navigator.userAgent || '';
  return {
    ua: ua,
    // Android's WebView marks itself "; wv)" — an app shell wrapping this page
    // rather than Chrome. A shell must implement the file chooser and the camera
    // permission callback itself; most wrappers built to show one site do not.
    webview: /;\s*wv\)/.test(ua) || (/Android/.test(ua) && !/Chrome\/\d/.test(ua)),
    standalone: !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                || navigator.standalone === true,
    secure: !!window.isSecureContext,
    origin: location.origin,
    camera: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    notify: 'Notification' in window,
    notifyState: (window.Notification && Notification.permission) || 'unavailable',
    push: ('serviceWorker' in navigator) && ('PushManager' in window),
    vibrate: 'vibrate' in navigator,
  };
}

// A tap that opens a file chooser or a camera takes focus off this page. There is
// no event for "the chooser did not open" — but there is one for it opening, so
// silence for a second and a half means it didn't, and that is worth saying out
// loud instead of leaving somebody tapping.
function watchChooser(){
  let opened = false;
  const seen = ()=>{ opened = true; cleanup(); };
  const cleanup = ()=>{
    document.removeEventListener('visibilitychange', seen);
    window.removeEventListener('blur', seen);
  };
  document.addEventListener('visibilitychange', seen);
  window.addEventListener('blur', seen);
  setTimeout(()=>{
    cleanup();
    if(opened || S.lrScanBusy || S.screen==='lrscan') return;
    const e = envReport();
    toast(e.webview
      ? 'The app shell blocked the camera — open the site in Chrome'
      : 'Nothing opened — tap “Check this device” to see why');
  }, 1600);
}

      <div style="flex:1;min-width:0">

  app.innerHTML = `<div class="topbar"><button class="link" id="back">‹ Back</button><h1>Device check</h1></div>
    <div class="detwrap">
      ${row(!e.webview, e.webview ? 'Running inside an app shell (WebView)' : 'Running in a real browser',

          ? 'This is the wrapper app, not Chrome. A wrapper has to implement the file chooser and the camera itself — if it does not, <b>Take a photo</b> and <b>Choose a photo</b> do nothing at all, with no error. Open the same address in Chrome and they work.'
          : 'File chooser and camera capture are available.')}

        e.camera ? 'Photos can be taken inside the app with a live preview.'
                 : 'Falls back to the phone’s camera app.')}
      ${row(e.notify && e.notifyState==='granted', 'Phone notification banners: '+esc(e.notifyState),
        !e.notify ? 'This device or shell has no notification support.'
        : e.notifyState==='granted' ? 'New alerts appear as a banner while the app is open.'
        : e.secure ? 'Not allowed yet — tap the button below to ask.'
        : 'Cannot be asked for on an http page.')}
      ${row(e.push, 'Background push (app closed)',
        e.push ? 'This device could receive push once a push key is configured on the server.'
               : 'Not available: needs a service worker, which needs an https page. Alerts arrive while the app is open instead.')}
      ${e.notify && e.notifyState!=='granted' && e.secure
        ? `<button class="btn" id="askperm" style="margin-top:14px">Allow notification banners</button>` : ''}
      <div class="hint" style="margin-top:16px;word-break:break-all">${esc(e.ua)}</div>

    </div>`;
  document.getElementById('back').onclick=()=>{ S.screen = S.diagBack || 'notifs'; render(); };
  const ask = document.getElementById('askperm');
  if(ask) ask.onclick = async ()=>{

// ---- alerts while the app is open ------------------------------------------
// The honest substitute for push on a warehouse phone reaching this over plain
// http: while the app is open it checks in every minute, and when a queue GROWS
// it buzzes the phone and drops a bar at the top. On an https page, and with
// permission given, the same moment also raises a real notification banner.
let notifSeen = null;

async function pollNotifs(){
  if(!S.token || document.visibilityState !== 'visible') return;
  let c;
  try{ c = await api('/api/notifications/count'); }catch(e){ return; }
  const before = notifSeen, now = c.unread || 0;
  S.notifCounts = c;
  if(before != null && now > before) alertNew(now - before, c);
  notifSeen = now;
  // update the tab badge in place — re-rendering would throw away a half-filled
  // form on whatever screen someone is actually working on
  const chip = document.querySelector('.chip[data-tab="notifs"]');
  if(chip && S.screen !== 'notifs') chip.innerHTML = '🔔' + (now ? ` <b>${now}</b>` : '');
  if(S.screen === 'notifs' && before != null && now !== before) paintNotifs();
}

function alertNew(added, counts){
  try{ if(navigator.vibrate) navigator.vibrate(counts.critical ? [130, 80, 130] : 130); }catch(e){}
  if(window.Notification && Notification.permission === 'granted'){
    try{
      new Notification(`ESSA · ${added} new alert${added===1?'':'s'}`, {
        body: `${counts.unread||0} unread — open the app to see them`,
        icon: '/m/icon-192.png', tag: 'essa-alerts',
      });
    }catch(e){ /* some shells expose the constructor and refuse to build one */ }
  }
  const old = document.getElementById('alertbar');
  if(old) old.remove();
  const bar = document.createElement('div');
  bar.id = 'alertbar'; bar.className = 'alertbar';
  bar.innerHTML = `<span>🔔 ${added} new alert${added===1?'':'s'} — ${counts.unread||0} unread</span>
    <button class="link" style="color:#fff;text-decoration:underline">View</button>`;
  document.body.appendChild(bar);
  bar.onclick = ()=>{ bar.remove(); S.screen='notifs'; render(); };
  setTimeout(()=>bar.remove(), 12000);
}

// ---- taking a photo of a document ------------------------------------------
// A phone camera hands back 8-12MB off the sensor, 4000px wide and on an iPhone
// in HEIC, which the vision API does not accept at all. Everything that leaves
// here is a JPEG with a 2400px long edge — plenty to read a docket by, a second
// to upload on mobile data, and one format instead of three.
const PHOTO_MAX = 2400;             // long edge in pixels
const PHOTO_SKIP = 900 * 1024;      // already small enough — send it untouched

function loadImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(url); res(im); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('could not decode')); };
    im.src=url;
  });
}

async function shrinkImage(file){
  if(!file || !/^image\//.test(file.type||'')) return file;   // a PDF goes up as it is
  if(file.size<=PHOTO_SKIP) return file;
  try{
    const im=await loadImage(file);
    const w=im.naturalWidth, h=im.naturalHeight;
    if(!w||!h) return file;
    const s=Math.min(1, PHOTO_MAX/Math.max(w,h));
    const c=document.createElement('canvas');
    c.width=Math.round(w*s); c.height=Math.round(h*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));
    // only when it actually helped: a small sharp photo re-encoded larger is
    // a worse picture AND a slower upload
    return blob && blob.size<file.size ? blob : file;
  }catch(e){ return file; }        // undecodable here may still be readable there
}

// The picture is taken in-page from a live preview rather than by handing off to
// the phone's camera app. Three reasons: the frame can be checked against the
// docket before it is taken, the file is already the right size and format when
// it leaves, and an iOS home-screen install — which this app is, it ships a
// manifest — has a long history of simply ignoring a tap on a capture input.
// The camera app remains the fallback for anything without getUserMedia, and for
// a page served over plain http, where the browser refuses the camera outright.
async function capturePhoto(cb){
  const viaCameraApp = ()=>chooseFile('image/*', true,
    async f=>cb(await shrinkImage(f), 'lr-photo.jpg'));
  if(!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia))
    return viaCameraApp();

  const ov=document.createElement('div'); ov.className='scanov';
  ov.innerHTML=`<video id="pvid" playsinline muted></video>
    <div class="scanhint">Fill the frame with the LR — hold steady until the text is sharp</div>
    <button class="shutter" id="snap" aria-label="Take the photo"></button>
    <button class="scanx" id="pcancel" style="left:16px;transform:none;padding:12px 20px">Cancel</button>`;
  document.body.appendChild(ov);
  const vid=ov.querySelector('#pvid');
  let stream=null;
  const close=()=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); ov.remove(); };
  ov.querySelector('#pcancel').onclick=close;

  try{
    // ask for the highest frame the camera will give: this is being read as
    // text, and a 640px preview of a docket is not readable by anything
    stream=await navigator.mediaDevices.getUserMedia({audio:false,
      video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}}});
    vid.srcObject=stream;
    await vid.play();
  }catch(e){
    close();
    toast(e && e.name==='NotAllowedError'
      ? 'Camera permission denied — opening the camera app'
      : 'Camera unavailable — opening the camera app');
    return viaCameraApp();
  }

  ov.querySelector('#snap').onclick=()=>{
    const w=vid.videoWidth, h=vid.videoHeight;
    if(!w||!h){ toast('Camera still warming up — try again in a moment'); return; }
    const s=Math.min(1, PHOTO_MAX/Math.max(w,h));
    const c=document.createElement('canvas');
    c.width=Math.round(w*s); c.height=Math.round(h*s);
    c.getContext('2d').drawImage(vid,0,0,c.width,c.height);
    c.toBlob(b=>{
      close();
      if(b) cb(b,'lr-photo.jpg'); else toast('Could not take the photo — try again');
    },'image/jpeg',0.9);
  };
}
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

// ---------- boot ----------
// One place that writes the signed-in identity, used by both the login and the
// verify on start-up — so the role can never be stored by one path and missed
// by the other.
function setSession(r){
  S.token = r.token || S.token;
  S.user  = r.user || S.user;
  S.role  = r.role || '';
  localStorage.setItem('essa_token', S.token);
  localStorage.setItem('essa_user', S.user||'');
  localStorage.setItem('essa_role', S.role||'');
}

// ---------- which building this handset is in ----------
// Read from the server rather than trusted from storage: a warehouse can be
// closed, renamed, or taken off this account's allotment while the phone is in
// somebody's pocket, and the answer must change the next time it opens rather
// than at the next sign-in — the same reason `role` is re-read on every verify.
//
// /api/locations/warehouses already returns ONLY the buildings this account may
// enter (routers/locations.list_warehouses narrows on the allotment), it reads at
// floor rank, and it is deliberately not one of the warehouse-scoped screens in
// security.WAREHOUSE_SCOPED — so it stays reachable when no warehouse is chosen
// yet, which is exactly what a picker needs.
async function loadWarehouses(){
  try{ S.warehouses = (await api('/api/locations/warehouses')).filter(w=>w.active!==false); }
  catch(e){ S.warehouses = []; }
  return S.warehouses;
}

function setWarehouse(w){
  // Only what identifies the building travels — the rest of the payload is a
  // postal address the phone never prints. Same four keys the desktop stores.
  S.warehouse = w ? {id:w.id, name:w.name, code:w.code, catalogue:w.catalogue} : null;
  if(S.warehouse) localStorage.setItem('essa_warehouse', JSON.stringify(S.warehouse));
  else localStorage.removeItem('essa_warehouse');
  // Everything loaded belongs to the building just left. Dropping it here rather
  // than at each screen is what stops Karur's consignments sitting under an Erode
  // header until somebody happens to pull to refresh.
  S.products=[]; S.lr=[]; S.grns=[]; S.bundles=[]; S.locations=[];
  S.grn=null; S.bundle=null; S.lrSel=null; S.selected=null;
  S.audit=undefined; S.lastScan=null;
}

// Where to go once signed in. One warehouse means there is no question to ask —
// asking it would be a form with one answer — so it is adopted silently. Two or
// more and the picker comes first: everything behind it files work against a
// building, and a handset that guessed would be wrong roughly half the time.
async function afterSignIn(){
  await loadWarehouses();
  const here = S.warehouse && S.warehouses.find(w=>w.id===S.warehouse.id);
  if(here){ setWarehouse(here); }                 // refresh a renamed building
  else if(S.warehouses.length===1) setWarehouse(S.warehouses[0]);
  else { setWarehouse(null); S.screen='warehouse'; return render(); }
  S.screen='list'; await loadOptions(); render();
}

function renderWarehouse(){
  const first = !S.warehouse;
  app.innerHTML = `<div class="topbar">
      ${first?'':'<button class="link" id="back">‹ Back</button>'}
      <h1>Which warehouse?</h1></div>
    <div class="detwrap">
      <div class="hint" style="margin-bottom:14px">Everything on this phone —
        consignments, receipts, cartons, counts — belongs to the building you are
        standing in. Pick it once; it stays until you change it.</div>
      ${S.warehouses.length ? S.warehouses.map(w=>`
        <div class="prow" data-wh="${w.id}" style="${S.warehouse&&S.warehouse.id===w.id
          ?'border-color:var(--accent);border-width:2px':''}">
          <div style="flex:1;min-width:0">
            <div class="t">${esc(w.name)}</div>
            <div class="m">${esc([w.code, w.city, w.catalogue].filter(Boolean).join(' · '))||'&nbsp;'}</div>
          </div>
          ${S.warehouse&&S.warehouse.id===w.id
            ?'<span class="badge bdone">here</span>':''}
        </div>`).join('')
        : `<div class="card" style="max-width:none">
             <b>No warehouse available</b>
             <div class="hint" style="margin-top:6px">This account is not allotted
               any warehouse, or none has been added yet. A super admin sets both
               on the desktop app.</div>
           </div>`}
      <div style="height:20px"></div>
      <button class="btn sec" id="lo">Sign out</button>
      <div style="height:30px"></div>
    </div>`;
  document.getElementById('lo').onclick = logout;
  const b = document.getElementById('back');
  if(b) b.onclick = ()=>{ S.screen='list'; render(); };
  app.querySelectorAll('[data-wh]').forEach(row=>row.onclick = async ()=>{
    const w = S.warehouses.find(x=>x.id===+row.dataset.wh);
    if(!w) return;
    setWarehouse(w);
    S.screen='list';
    // Re-read with the new header on: the option lists a detail form offers come
    // from the receiving warehouse's own catalogue, and a silk building's
    // categories are not a garment building's.
    await loadOptions();
    render();
    toast('Now in '+w.name);
  });
}

(async function boot(){
  if(S.token){
    try{
      const v = await api('/api/auth/verify?token='+encodeURIComponent(S.token));
      if(v.ok){ setSession(v); return afterSignIn(); }
    }catch(e){}
  }
  S.screen='login'; render();
})();

async function loadOptions(){ try{ S.options = await api('/api/inventory/product-options'); }catch(e){ S.options={}; }
  loadLocations(); loadNotifCount(); startAlertPoll(); }

// One timer for the life of the session. Started from here rather than at the top
// of the file so it never runs for someone who is not signed in, and guarded so a
// second sign-in does not leave two of them running.
let alertTimer = null;
function startAlertPoll(){
  if(alertTimer) return;
  alertTimer = setInterval(pollNotifs, 60000);
  // and immediately on coming back to the app, which is when somebody actually
  // wants to know what happened while it was in their pocket
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') pollNotifs();
  });
}

// ---------- render ----------
function render(){
  if(S.screen==='login') return renderLogin();
  if(S.screen==='warehouse') return renderWarehouse();
  if(S.screen==='detail') return renderDetail();
  if(S.screen==='notifs') return renderNotifs();
  if(S.screen==='diag') return renderDiag();
  if(S.screen==='lr') return renderLR();
  if(S.screen==='lrscan') return renderLRScan();
  if(S.screen==='lrdetail') return renderLRDetail();
  if(S.screen==='grn') return renderGrnList();
  if(S.screen==='grndetail') return renderGrn();
  if(S.screen==='grnbreak') return renderBreak();
  if(S.screen==='grnshort') return renderShort();
  if(S.screen==='grnposted') return renderPosted();
  if(S.screen==='bundles') return renderBundles();
  if(S.screen==='bundle') return renderBundle();
  if(S.screen==='audit') return renderAudit();
  return renderList();
}

// What the warehouse does on the phone, in the order the goods move: take the
// consignment in, receive what the cartons hold, store and later open those
// cartons, and detail the products that come out of them.
function tabs(active){
  // the unread count rides on the tab itself: a phone has no room for a bell in
  // a corner, and a number nobody can see is a number nobody acts on
  const un = S.notifCounts.unread || 0;
  return `<div class="row" style="gap:8px;overflow:auto">
    <div class="chip ${active==='lr'?'on':''}" data-tab="lr">Consignments</div>
    <div class="chip ${active==='grn'?'on':''}" data-tab="grn">Receive</div>
    <div class="chip ${active==='bundles'?'on':''}" data-tab="bundles">Bundles</div>
    <div class="chip ${active==='list'?'on':''}" data-tab="list">Products</div>
    <div class="chip ${active==='audit'?'on':''}" data-tab="audit">Audit</div>
    <div class="chip ${active==='notifs'?'on':''}" data-tab="notifs">🔔${un?` <b>${un}</b>`:''}</div>
  </div>${whoami()}`;
}

// Who this handset is currently signed in as. A warehouse phone is shared, put
// down and picked up, and every GRN posted from it is attributed to whoever it
// was left signed in as — so the answer belongs on the screen, not two taps
// away. The level is here for the same reason it is on the desktop: it is the
// answer to "why can I not do that from the phone", without asking anyone.
// …and WHICH BUILDING it is filing against. On the same line as the name and for
// the same reason: every consignment received, carton put away and count opened
// from this handset belongs to a warehouse, and a phone that did not say which
// would let somebody work a whole morning into the wrong one. Tappable, because
// the answer to "am I in the right building" has to be followed by "change it"
// without hunting through a menu.
function whoami(){
  if(!S.user) return '';
  const label = ROLE_LABEL[S.role] || S.role || '';
  const extra = atLeast('admin')
    ? ' · masters, reports and payments are on the desktop app'
    : '';
  const where = S.warehouse
    ? `<b style="color:var(--accent)">${esc(S.warehouse.name)}</b>`
    : `<b style="color:var(--warn)">no warehouse chosen</b>`;
  return `<div class="hint" style="margin-top:6px">
      <button class="link" id="whswitch" style="padding:0;font-size:11px">📍 ${where} ${
        (S.warehouses.length>1||!S.warehouse)?'· change':''}</button>
    </div>
    <div class="hint" style="margin-top:2px">
    Signed in as <b>${esc(S.user)}</b>${label?` · ${esc(label)}`:''}${extra}</div>`;
}
function wireTabs(){
  // The warehouse line sits inside every tab strip, so it is wired here too. The
  // list is re-read on the way in rather than trusted: a building added or taken
  // off this account's allotment on the desktop should appear the moment somebody
  // looks, not at the next sign-in.
  const sw = document.getElementById('whswitch');
  if(sw) sw.onclick = async ()=>{ await loadWarehouses(); S.screen='warehouse'; render(); };
  app.querySelectorAll('.chip[data-tab]').forEach(c=>c.onclick=()=>{
    if(S.screen===c.dataset.tab) return;
    // The count lives on the server, and another handset may have started or
    // closed one. Clearing it on the way in makes the screen re-read rather than
    // show a session that has since been closed by whoever had the other phone.
    if(c.dataset.tab==='audit'){ S.audit=undefined; S.lastScan=null; }
    S.screen=c.dataset.tab; render();
  });
}
function renderLogin(){
  app.innerHTML = `<div class="center">
    <div class="logo">AI</div>
    <div class="brand">ESSA <span>·</span> Warehouse</div>
    <div class="card">
      <div class="field"><label>Username</label><input id="u" autocapitalize="none" value="${esc(S.user)}" placeholder="your username"></div>
      <div class="field"><label>Password</label><input id="p" type="password" placeholder="••••••••"></div>
      <div class="field"><label>Your name (saved with what you receive &amp; detail)</label><input id="emp" placeholder="e.g. Ramesh" value="${esc(S.employee)}"></div>
      <div id="err" class="err"></div>
      <button class="btn" id="go">Sign in</button>
    </div></div>`;
  document.getElementById('go').onclick = async ()=>{
    const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
    S.employee=document.getElementById('emp').value.trim(); localStorage.setItem('essa_emp',S.employee);
    document.getElementById('go').disabled=true; document.getElementById('err').textContent='';
    try{ const r= await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
      setSession(r);
      await afterSignIn();

// Resolve whatever came off the scanner: a QR payload (JSON), an EAN-13, a SKU
// or an id. /lookup understands all four, so the same path serves both symbologies
// on the label. Falls back to a text search so typing a partial description works.
async function resolveCode(code){
  const c=(code||'').trim(); if(!c) return null;
  try{ return await api(`/api/inventory/lookup?code=${encodeURIComponent(c)}`); }
  catch(e){}
  try{ const data=await api(`/api/inventory/products?status=all&q=${encodeURIComponent(c)}`);
    return data.find(p=>(p.barcode||'')===c)||data[0]||null;
  }catch(e){ return null; }
}

  const b=document.getElementById('bc').value.trim(); if(!b) return;
  const p=await resolveCode(b);
  if(p){ S.selected=p; S.detailBack='list'; S.screen='detail'; render(); }
  else toast('No product for that code');

// ---- camera scanning -------------------------------------------------------
// Uses the browser's built-in BarcodeDetector: no external library, so the app
// stays a single self-contained file with no CDN to reach. Available on Android
// Chrome/Edge and desktop Chrome; iOS Safari has no implementation, so there the
// text field (hardware scanner or typing) remains the way in.
const SCAN_FORMATS=['qr_code','ean_13','code_128','ean_8','code_39'];
let scanStop=null;

function closeScanner(){
  if(scanStop){ scanStop(); scanStop=null; }
  const ov=document.getElementById('scanov'); if(ov) ov.remove();
}

// `onCode` receives the raw scan when the caller wants to do something other than
// open the product — pinning a GRN line to an existing item, for instance.
async function openScanner(onCode){
  if(!('BarcodeDetector' in window)){
    toast('This browser can’t use the camera scanner — type or use a handheld scanner');
    document.getElementById('bc')?.focus();
    return;
  }
  let supported=[];
  try{ supported=await window.BarcodeDetector.getSupportedFormats(); }catch(e){}
  const formats=SCAN_FORMATS.filter(f=>!supported.length||supported.includes(f));
  if(!formats.length){ toast('Camera scanner not supported here'); return; }

  const ov=document.createElement('div');
  ov.id='scanov'; ov.className='scanov';
  ov.innerHTML=`<video id="scanvid" playsinline muted></video>
    <div class="scanframe"></div>
    <div class="scanhint">Point at the QR or barcode on the label</div>
    <button class="scanx" id="scanx">Cancel</button>`;
  document.body.appendChild(ov);
  document.getElementById('scanx').onclick=closeScanner;

  const vid=document.getElementById('scanvid');
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){
    closeScanner();
    toast(e&&e.name==='NotAllowedError' ? 'Camera permission denied'
                                        : 'Could not open the camera');
    return;
  }
  vid.srcObject=stream;
  try{ await vid.play(); }catch(e){}

  const detector=new window.BarcodeDetector({formats});
  let alive=true;
  scanStop=()=>{ alive=false; stream.getTracks().forEach(t=>t.stop()); };

  // ~6 detections/sec: fast enough to feel instant, slow enough not to pin the CPU
  while(alive){
    try{
      const hits=await detector.detect(vid);
      if(hits&&hits.length){
        const code=hits[0].rawValue;
        closeScanner();
        if(onCode) return onCode(code);
        const p=await resolveCode(code);
        if(p){ S.selected=p; S.detailBack='list'; S.screen='detail'; render(); }
        else toast('Scanned, but no product matches that code');
        return;
      }
    }catch(e){ /* a frame that isn't decodable yet — keep going */ }
    await new Promise(r=>setTimeout(r,160));
  }
}
// ---- stock audit -----------------------------------------------------------
// Counting a rack with a phone. The whole screen is built around one gesture —
// scan, read the answer, scan again — so the button is thumb-sized and the
// verdict is the largest thing under it.
//
// Every scan is one round trip (`/scan` returns the finding AND the new tally),
// because on warehouse wifi a screen that needed three calls to answer one scan
// would feel broken long before it was.
const AUDIT_TONE={available:['vok','ok'],not_available:['vno','no'],unknown:['vunk','unk']};

async function auditOpen(){
  try{ S.audit=await api('/api/stock-audit/open',{method:'POST',body:JSON.stringify({})}); }
  catch(e){ toast(e.message||'Could not start a count'); return; }
  S.lastScan=null; render();
}
async function auditClose(){
  if(!S.audit) return;
  if(!confirm(`Close ${S.audit.code}? Its readings become a record and it takes no more scans.`)) return;
  try{ await api(`/api/stock-audit/${S.audit.id}/close`,{method:'POST'}); }
  catch(e){ toast(e.message||'Could not close the count'); return; }
  S.audit=null; S.lastScan=null; toast('Count closed'); render();
}
// The one call. `duplicate` is decided by the server so two handsets counting
// the same rack agree about what has already been seen.
async function auditScan(code){
  if(!S.audit) return;
  try{
    const r=await api(`/api/stock-audit/${S.audit.id}/scan`,
      {method:'POST',body:JSON.stringify({code})});
    S.audit.totals=r.totals;
    S.lastScan={...r.scan,duplicate:r.duplicate};
    // A refresh of the list, so the row that just moved to the top is there.
    S.audit=await api(`/api/stock-audit/${S.audit.id}`);
    S.lastScan={...r.scan,duplicate:r.duplicate};
    render();
    if(navigator.vibrate) navigator.vibrate(r.duplicate?[40,60,40]:30);
  }catch(e){ toast(e.message||'That scan could not be recorded'); }
}
async function auditDrop(id){
  if(!S.audit) return;
  try{
    await api(`/api/stock-audit/${S.audit.id}/scans/${id}`,{method:'DELETE'});
    S.audit=await api(`/api/stock-audit/${S.audit.id}`);
    if(S.lastScan&&S.lastScan.id===id) S.lastScan=null;
    render();
  }catch(e){ toast(e.message||'Could not remove that reading'); }
}

function auditVerdict(s){
  if(!s) return '';
  const [tone]=AUDIT_TONE[s.result]||['vunk'];
  const bits=[];
  if(s.sku) bits.push(`<b>${esc(s.sku)}</b>`);
  if(s.stock_qty!=null) bits.push(`stock <b>${s.stock_qty}</b>`);
  if(s.location) bits.push(`at ${esc(s.location)}`);
  return `<div class="verdict ${tone}">
    <div class="big">${s.result==='available'?'🟢':s.result==='not_available'?'🔴':'🟡'} ${esc(s.label)}</div>
    <div class="det">
      ${s.product_name?esc(s.product_name)+'<br>':''}
      ${bits.join(' · ')||'&nbsp;'}
      <br><span style="color:var(--muted)">${esc(s.code)}</span>
      ${s.duplicate?'<br><b>Already counted in this session</b> — not counted twice'
                   :''}
      ${s.result==='unknown'
        ? '<br>Product not found. Check the physical stock or the product master.'
        : ''}
    </div></div>`;
}

// ---------- receive: the bundle a supplier billed, broken into what arrived ----------
// A supplier bills "WOMEN'S T-SHIRT, 50 PCS" and never prints the mix. Only the
// person opening the cartons knows it, so the breakdown is entered here, and
// posting turns every row into its own product — its own SKU, QR, stock movement
// and weighted-average cost. Same endpoints the desktop calls, so stock is
// identical whichever end does it. Unposting stays on the desktop: it has to
// weigh payments, debit notes and dispatches first.
// The stock master's attribute columns (Attributes Reference.xlsx) less PRODUCT,
// which is the category. Brand leads — on a rack it is what the eye reaches for,
// and it is identity: an ESSA t-shirt and a YUVA t-shirt are two stock items.
const SPLIT_ATTRS=[['brand','Brand'],['size','Size'],['color','Colour'],['material','Material'],
  ['pattern','Pattern'],['fit','Fit'],['style','Style'],['sleeve','Sleeve'],
  ['product_type','Type'],['design_no','Design No']];
// Ordered as the retail price is worked out: MRP → Discount % → Sale price.
const SPLIT_MONEY=[['rate','Rate'],['mrp','MRP'],['sale_discount_pct','Discount %'],['sale_price','Sale price']];
// MRP less a percentage is a price. Solved for whichever corner was NOT just
// typed, so the phone behaves exactly as the desktop does (see fromMrp in
// frontend/src/App.jsx). Type 20 into Discount % against an MRP of 995 and the
// sale price reads 796; type 796 and the discount reads 20.
//
// Blank in, blank out: clearing the discount empties that box and leaves the
// price alone, rather than resolving to zero and marking the goods down to
// nothing. Retail pricing only — `rate` is what the supplier charged and is no
// part of this.
const SALE_CORNER={mrp:'mrp',sale_discount_pct:'pct',sale_price:'price'};
function saleCalc(row,key){
  const c=SALE_CORNER[key]; if(!c) return row;
  const n=v=>{ if(v===''||v==null) return null; const x=parseFloat(String(v).replace(/,/g,'')); return isFinite(x)?x:null; };
  const r2=v=>v==null?null:Math.round(v*100)/100;
  const mrp=n(row.mrp); let pct=n(row.sale_discount_pct), price=n(row.sale_price);
  if(mrp){
    if(c==='pct'&&pct!=null) price=r2(mrp*(1-pct/100));
    else if(c==='price'&&price!=null) pct=r2((1-price/mrp)*100);
    else if(c==='mrp'){
      if(pct!=null) price=r2(mrp*(1-pct/100));
      else if(price!=null) pct=r2((1-price/mrp)*100);
    }
  }
  row.sale_discount_pct=pct==null?'':String(pct);
  row.sale_price=price==null?'':String(price);
  return row;
}
const qtyOf=(v)=>Math.round((+v||0)*1000)/1000;
// quantities are floats — compare with the tolerance the server posts with
const sameQty=(a,b)=>Math.abs((+a||0)-(+b||0))<0.001;
const vLabel=(r)=>SPLIT_ATTRS.map(([k])=>r[k]).filter(Boolean).join(' · ');
const blankRow=(rate,cat)=>Object.assign(
  {category:cat||'',qty:'',rate:rate!=null?String(rate):'',mrp:'',sale_price:'',sale_discount_pct:''},
  Object.fromEntries(SPLIT_ATTRS.map(([k])=>[k,''])));
// One logout for all four buttons that offer it. It also tells the server, which
// clears the cookie the token is mirrored into — without that call the cookie
// outlives the sign-out, and the next person to pick the phone up can still pull
// invoice images out of it.
// The WAREHOUSE is deliberately not cleared. A handset is a physical object that
// lives in one building and gets picked up by whoever is on shift; forgetting
// where it is standing every time somebody signs out would ask the same question
// four times a day. It is re-validated against the next person's allotment on
// sign-in (afterSignIn), so an account that may not enter it is not left in it.
const logout=()=>{
  api('/api/auth/logout',{method:'POST'}).catch(()=>{});
  localStorage.removeItem('essa_token'); localStorage.removeItem('essa_role');
  S.token=''; S.role=''; S.warehouses=[]; S.screen='login'; render();
};
